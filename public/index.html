<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Malfred: Ashen Ring</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c"></canvas>

<div id="menu" class="overlay">
  <div class="card">
    <h1>Malfred</h1>
    <p class="sub">Ashen Ring &mdash; knock your rivals into the lava</p>
    <input id="name" maxlength="14" placeholder="Your name" autocomplete="off">
    <button id="btnBrawl" class="primary">Endless Brawl<small>public free-for-all &middot; grow stronger the longer you survive</small></button>
    <button id="btnCreate">Create Private Room<small>round-based match with friends (and bots)</small></button>
    <div class="row">
      <input id="code" maxlength="4" placeholder="CODE" autocomplete="off">
      <button id="btnJoin">Join Room</button>
    </div>
    <p id="err"></p>
    <p class="help"><b>Right-click</b> move &middot; <b>Left-click / Q</b> bolt &middot; <b>W E R D F</b> spells at cursor &middot; <b>S</b> stop<br>
    <b>Shift+key</b> or the <b>+</b> buttons spend upgrade points</p>
  </div>
</div>

<div id="hud" hidden>
  <div id="topleft">
    <div id="roomInfo"></div>
    <div id="feed"></div>
  </div>
  <div id="board"></div>
  <div id="banner"></div>
  <div id="lobby" class="card" hidden>
    <h2>Room <span id="lobbyCode"></span></h2>
    <p>Invite friends with this link:</p>
    <div class="row"><input id="link" readonly><button id="btnCopy">Copy</button></div>
    <div id="lobbyList"></div>
    <div class="row" id="botRow">
      <span>Bots</span><button id="botMinus">&minus;</button><b id="botN">0</b><button id="botPlus">+</button>
    </div>
    <button id="btnStart" class="primary">Start Match</button>
    <p id="lobbyNote"></p>
  </div>
  <div id="bottom">
    <div id="pts"></div>
    <div id="bar"></div>
  </div>
  <div id="sysBtns">
    <button id="btnMute" title="Sound on/off (M)">🔊</button>
    <button id="btnMenu" title="Menu (Esc)">☰</button>
  </div>
</div>

<div id="pause" hidden>
  <div class="card">
    <h2>Menu</h2>
    <button id="btnResume" class="primary">Resume</button>
    <button id="btnSound">Sound: on (M)</button>
    <button id="btnLeave">Leave game</button>
    <p class="help">The match keeps running while this menu is open.</p>
  </div>
</div>
<script type="module" src="client.js"></script>
</body>
</html>
